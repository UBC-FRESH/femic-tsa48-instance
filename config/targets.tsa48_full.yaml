# Full North Island TSA 48 benchmark targets.
#
# The 2020 North Island TSA Timber Supply Review data package reports a current
# AAC of 1,248,100 m3/yr and a current THLB of 177,505 ha. Product accounts
# accumulate over a target period, so each decade target is 10 * 1,248,100 =
# 12,481,000 m3. The lower and upper bounds are the same: the benchmark asks
# whether the model can hold the legal AAC across the full horizon, not just in
# the first decade.
targets:
  - account: product.Yield.managed.Total
    period: 1
    period_width: 10
    minimum: 12480000
    maximum: 12481000
    min_weight: 1
    max_weight: 1
    notes: "AAC decade 1, offsets 0-9."
  - account: product.Yield.managed.Total
    period: 2
    period_width: 10
    minimum: 12480000
    maximum: 12481000
    min_weight: 1
    max_weight: 1
    notes: "AAC decade 2, offsets 10-19."
  - account: product.Yield.managed.Total
    period: 3
    period_width: 10
    minimum: 12480000
    maximum: 12481000
    min_weight: 1
    max_weight: 1
    notes: "AAC decade 3, offsets 20-29."
  - account: product.Yield.managed.Total
    period: 4
    period_width: 10
    minimum: 12480000
    maximum: 12481000
    min_weight: 1
    max_weight: 1
    notes: "AAC decade 4, offsets 30-39."
  - account: product.Yield.managed.Total
    period: 5
    period_width: 10
    minimum: 12480000
    maximum: 12481000
    min_weight: 1
    max_weight: 1
    notes: "AAC decade 5, offsets 40-49."
  - account: product.Yield.managed.Total
    period: 6
    period_width: 10
    minimum: 12480000
    maximum: 12481000
    min_weight: 1
    max_weight: 1
    notes: "AAC decade 6, offsets 50-59."
  - account: product.Yield.managed.Total
    period: 7
    period_width: 10
    minimum: 12480000
    maximum: 12481000
    min_weight: 1
    max_weight: 1
    notes: "AAC decade 7, offsets 60-69."
  - account: product.Yield.managed.Total
    period: 8
    period_width: 10
    minimum: 12480000
    maximum: 12481000
    min_weight: 1
    max_weight: 1
    notes: "AAC decade 8, offsets 70-79."
  - account: product.Yield.managed.Total
    period: 9
    period_width: 10
    minimum: 12480000
    maximum: 12481000
